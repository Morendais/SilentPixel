name: Build SilentPixel APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Verify build environment
        run: |
          echo "Android SDK root: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentPixel-release-apk
          path: SilentPixel.apk
          if-no-files-found: ignore
